name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            targets: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            targets: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            targets: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: false

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # macOS 的 TCC（辅助功能 / 自动化）是按代码签名认应用的：
      # 不签名（ad-hoc）时每次更新 cdhash 都变，授权条目就失效，用户得删掉旧条目重新授权。
      # 只有证书真的配好时才注入 APPLE_SIGNING_IDENTITY 等变量——空字符串也会被
      # tauri 当成「指定了签名身份」，codesign 用空身份签名会直接失败。
      - name: Configure macOS signing
        if: matrix.platform == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$IDENTITY" ]; then
            echo "::warning::未配置证书，本次为 ad-hoc 签名（更新后系统权限会失效）"
            exit 0
          fi
          echo "$CERT" | base64 --decode > certificate.p12
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security import certificate.p12 -k temp.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions temp.keychain
          rm certificate.p12
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            [ -n "$NOTARY_APPLE_ID" ] && echo "APPLE_ID=$NOTARY_APPLE_ID"
            [ -n "$NOTARY_PASSWORD" ] && echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            [ -n "$TEAM_ID" ] && echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pastoid ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}