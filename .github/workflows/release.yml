name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动干跑：验证 workflow / 签名配置是否正常，产物进草稿，不会公开
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            targets: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            targets: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            targets: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: false

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # macOS 的 TCC（辅助功能 / 自动化）是按代码签名认应用的：
      # 不签名（ad-hoc）时每次更新 cdhash 都变，授权条目就失效，用户得删掉旧条目重新授权。
      # 这里用固定证书签名（自签名或 Developer ID 都行），授权可以跨版本保留。
      # 注意：这一版 macOS 的 security import 不认 PKCS12，所以证书和私钥分开用 PEM 导入。
      - name: Configure macOS signing
        if: matrix.platform == 'macos-latest'
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          KEY_B64: ${{ secrets.APPLE_KEY }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$KEY_B64" ] || [ -z "$IDENTITY" ]; then
            echo "::warning::未配置签名证书，本次为 ad-hoc 签名（更新后系统权限会失效）"
            exit 0
          fi
          echo "$CERT_B64" | base64 --decode > cert.pem
          echo "$KEY_B64" | base64 --decode > key.pem
          security create-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security import cert.pem -k build.keychain -T /usr/bin/codesign
          security import key.pem -k build.keychain -T /usr/bin/codesign
          # 自签名证书在部分 runner 上 set-key-partition-list 会静默失败；
          # -T /usr/bin/codesign 已经给了 codesign 权限，这里失败不算致命
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain || true
          security find-identity -p codesigning build.keychain | tail -3
          rm -f cert.pem key.pem
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            [ -n "$NOTARY_APPLE_ID" ] && echo "APPLE_ID=$NOTARY_APPLE_ID"
            [ -n "$NOTARY_PASSWORD" ] && echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            [ -n "$TEAM_ID" ] && echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pastoid ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          args: ${{ matrix.args }}