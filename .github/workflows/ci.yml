name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个平台至少编译一次；只有本机架构才跑测试，跨架构测试要 Rosetta / 交叉运行，没必要
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            run_tests: true
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            run_tests: false
          - platform: 'windows-latest'
            target: ''
            run_tests: true

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Check TypeScript
        run: bun run tsc --noEmit

      # 前端真正打包一次，防止只有 vite 阶段才暴露的问题（别名、资源路径等）
      - name: Build frontend
        run: bun run vite build

      - name: Check themes
        run: bun run check:themes

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 只做类型检查，不打安装包：打包/签名的问题留给 Release 或本地
      - name: Cargo check
        shell: bash
        run: |
          args=(--manifest-path src-tauri/Cargo.toml)
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
          fi
          cargo check "${args[@]}"

      - name: Cargo test
        if: matrix.run_tests
        shell: bash
        run: |
          args=(--manifest-path src-tauri/Cargo.toml)
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
          fi
          cargo test "${args[@]}"
