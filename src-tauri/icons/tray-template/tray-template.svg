<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 16 16">
  <!-- macOS 菜单栏模板图：只取 alpha，颜色由系统决定（深色栏→白，浅色栏→黑） -->
  <mask id="m">
    <rect width="16" height="16" fill="#000"/>
    <rect x="2.6" y="2.9" width="10.8" height="12.0" rx="2.9" fill="#fff"/>
    <rect x="5.6" y="1.1" width="4.8" height="3.2" rx="1.2" fill="#fff"/>
    <rect x="5.2" y="7.0" width="5.6" height="1.5" rx="0.75" fill="#000"/>
    <rect x="5.2" y="10.2" width="5.6" height="1.5" rx="0.75" fill="#000"/>
  </mask>
  <rect width="16" height="16" fill="#000000" mask="url(#m)"/>
</svg>
